name: staff_transport_reminder
description: "Staff Transport Reminder - Get alerted when approaching your destination."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Location
  geolocator: ^13.0.4
  geocoding: ^3.0.0

  # Background foreground service (keeps app alive when screen is locked)
  flutter_foreground_task: ^8.13.0

  # Local storage
  shared_preferences: ^2.3.3

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Map picker
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permissions
  permission_handler: ^11.3.1

  # Vibration
  vibration: ^2.0.0

  # URL launcher (for battery optimization settings)
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
